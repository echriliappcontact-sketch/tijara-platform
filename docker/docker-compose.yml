version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tijara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tijara_db
      POSTGRES_USER: tijara
      POSTGRES_PASSWORD: tijara_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tijara -d tijara_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tijara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: