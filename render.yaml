services:
  - type: web
    name: tijara-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate && npx tsc -p tsconfig.json
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tijara-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "30d"
      - key: PORT
        value: "10000"

databases:
  - name: tijara-db
    plan: free
    region: frankfurt
    databaseName: tijara
    ipAllowList: []
